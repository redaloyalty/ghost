backend = "glx";
vsync = true;
corner-radius = 6;
rounded-corners-exclude = [ "class_g = 'Polybar'", "class_g = 'i3bar'" ];
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.55;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-exclude = [ "class_g = 'Polybar'", "_GTK_FRAME_EXTENTS@:c" ];
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
inactive-dim = 0.12;
focus-exclude = [ "class_g = 'Rofi'", "class_g = 'mind-float'" ];
blur-method = "dual_kawase";
blur-strength = 6;
blur-background-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "_GTK_FRAME_EXTENTS@:c" ];
