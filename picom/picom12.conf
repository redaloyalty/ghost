backend = "glx";
vsync = true;
corner-radius = 6;
rounded-corners-exclude = [ "class_g = 'Polybar'", "class_g = 'i3bar'" ];
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.55;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-exclude = [ "class_g = 'Polybar'", "_GTK_FRAME_EXTENTS@" ];
fading = false;  # v12: animations do the fades
fade-in-step = 0.06;
fade-out-step = 0.06;
inactive-dim = 0.12;
focus-exclude = [ "class_g = 'Rofi'", "class_g = 'mind-float'" ];
blur-method = "dual_kawase";
blur-strength = 6;
blur-background-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "_GTK_FRAME_EXTENTS@" ];

# ---- v12 only: animations (bin/compositor picks this file when ~/.local/bin/picom is v12)
animations = (
  # a window opens: quick pop from 95%
  { triggers = [ "open" ]; preset = "appear"; duration = 0.18; scale = 0.95; },
  # a window closes: quick fade and shrink
  { triggers = [ "close" ]; preset = "disappear"; duration = 0.14; scale = 0.95; },
  # switching workspaces (i3 hides/shows windows): soft fade only, no scale
  { triggers = [ "show" ]; preset = "appear"; duration = 0.12; scale = 1; },
  { triggers = [ "hide" ]; preset = "disappear"; duration = 0.10; scale = 1; },
  # move or resize: glide to the new place
  { triggers = [ "geometry" ]; preset = "geometry-change"; duration = 0.15; },
);

# glass-begin (managed by bin/glass)
opacity-rule = [
  "100:window_type = 'normal' && class_g != 'kitty' && class_g != 'obs' && class_g != 'ffplay' && class_g != 'mpv' && !fullscreen",
];
# glass-end
