[colors]
void = #e00a0a0a
ash = #121412
line = #2a2f2a
dim = #7d8079
bone = #d6d3cb
nv = #8fbf8f
blood = #c2564a

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 30
offset-y = 0
background = ${colors.void}
foreground = ${colors.bone}
line-size = 2
padding-left = 1
padding-right = 2
module-margin = 1
separator = %{F#2a2f2a}│%{F-}
font-0 = JetBrainsMono Nerd Font:size=10;3
font-1 = JetBrainsMono Nerd Font:size=13;3
modules-left = ws title
modules-center = mind
modules-right = cpu mem wifi vol bat date
tray-position = right
tray-padding = 4
cursor-click = pointer
enable-ipc = true

[bar/side]
inherit = bar/main
modules-left = ws
modules-center = date
modules-right = bat
tray-position = none

[module/ws]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false
label-focused = %name%
label-focused-foreground = ${colors.nv}
label-focused-underline = ${colors.nv}
label-focused-padding = 1
label-unfocused = %name%
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 1
label-visible = %name%
label-visible-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.blood}
label-urgent-padding = 1

[module/title]
type = internal/xwindow
label = %title:0:50:…%
label-foreground = ${colors.dim}

[module/mind]
type = custom/script
exec = ~/dotfiles/polybar/mind.sh
interval = 5
click-left = kitty --class mind-float --title mind -e mind chat &
click-right = ~/dotfiles/bin/mind-ask &

[module/cpu]
type = internal/cpu
interval = 2
label = 󰻠 %percentage:2%%
format-prefix-foreground = ${colors.nv}

[module/mem]
type = internal/memory
interval = 3
label = 󰍛 %percentage_used:2%%

[module/wifi]
type = internal/network
interface-type = wireless
interval = 5
label-connected = 󰖩 %essid%
label-disconnected = %{F#7d8079}󰖪 offline%{F-}

[module/vol]
type = internal/pulseaudio
label-volume = 󰕾 %percentage%%
label-muted = %{F#7d8079}󰖁 muted%{F-}
click-right = pavucontrol &

[module/bat]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
label-charging = 󰂄 %percentage%%
label-discharging = 󰁹 %percentage%%
label-full = 󰁹 full
label-low = %{F#c2564a}󰂃 %percentage%%%{F-}
low-at = 15

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %{F#7d8079}%date%%{F-}  %{F#d6d3cb}%time%%{F-}
