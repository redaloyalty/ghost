; Ghost HUD bar. Labels dim, values bone, active nv green. Colours: ~/dotfiles/palette.md
[colors]
void = #e60a0a0a
line = #2a2f2a
dim = #7d8079
bone = #d6d3cb
nv = #8fbf8f
nvhi = #b6e3a8
blood = #c2564a

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 34
background = ${colors.void}
foreground = ${colors.bone}
border-bottom-size = 1
border-bottom-color = ${colors.line}
line-size = 2
padding-left = 0
padding-right = 1
module-margin = 1
separator = %{F#2a2f2a}·%{F-}
font-0 = IosevkaTerm Nerd Font:style=Bold:size=11;3
font-1 = IosevkaTerm Nerd Font:size=11;3
font-2 = IosevkaTerm Nerd Font:size=16;4
; Arabic (and other scripts) for song titles
font-3 = DejaVu Sans:size=10;3
modules-left = ghost ws title
modules-center = rec mind clock dk
modules-right = music cpu temp mem disk wifi bt vol mic bat kbd tray power
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3

[bar/side]
inherit = bar/main
modules-left = ghost ws
modules-center = clock dk
modules-right = cpu mem mic bat kbd power

[module/ghost]
type = custom/text
format = %{T3}󰊠%{T-}
format-foreground = ${colors.nv}
format-padding = 2
click-left = rofi -show drun &
click-right = ~/dotfiles/bin/keys &

[module/ws]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false
index-sort = true
format = <label-state> <label-mode>
ws-icon-0 = 1:TERM; TERM
ws-icon-1 = 2:WEB;󰖟 WEB
ws-icon-2 = 3:CODE;󰨞 CODE
ws-icon-3 = 4:NOTES;󰠮 NOTES
ws-icon-4 = 5:MIND;󰧑 MIND
ws-icon-5 = 6;󰭹 6
ws-icon-6 = 7;7
ws-icon-7 = 8;8
ws-icon-8 = 9;9
ws-icon-9 = 10;10
ws-icon-default = ?
label-mode = %{F#c2564a}[%mode%]%{F-}
label-focused = [%icon%]
label-focused-foreground = ${colors.nv}
label-unfocused = " %icon% "
label-unfocused-foreground = ${colors.dim}
label-visible = " %icon% "
label-visible-foreground = ${colors.bone}
label-urgent = " %icon% "
label-urgent-foreground = ${colors.blood}

[module/title]
type = internal/xwindow
label = %title:0:48:…%
label-foreground = ${colors.dim}
label-font = 2

[module/mind]
type = custom/script
exec = ~/dotfiles/polybar/mind.sh
interval = 5
click-left = kitty --class mind-float --title mind -e mind chat &
click-right = ~/dotfiles/bin/mind-ask &

[module/clock]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
date-alt = week %V  %Y-%m-%d
time-alt = %H:%M:%S
label = %{F#7d8079}%date%%{F-} %{F#b6e3a8}%time%%{F-}

[module/rec]
type = custom/script
exec = ~/dotfiles/polybar/rec.sh
interval = 1
click-left = ~/dotfiles/bin/rec &

[module/dk]
; Denmark time - the team and the shops run on it
type = custom/script
exec = TZ=Europe/Copenhagen date +"%{F#7d8079}DK%{F-} %H:%M"
interval = 15
click-left = notify-send "Denmark" "$(TZ=Europe/Copenhagen date '+%A %d %b, %H:%M')"

[module/music]
; shows only while something plays (Chrome/SoundCloud, Spotify...). click: prev / play-pause / next
type = custom/script
exec = ~/dotfiles/bin/music status
interval = 2

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.dim}
label = %percentage:2%%
warn-percentage = 85
format-warn = <label-warn>
format-warn-prefix = "󰻠 "
label-warn = %percentage:2%%
label-warn-foreground = ${colors.blood}

click-left = ~/dotfiles/bin/hog &
[module/temp]
type = internal/temperature
thermal-zone = 10
interval = 3
warn-temperature = 85
format-prefix = "󰔏 "
format-prefix-foreground = ${colors.dim}
label = %temperature-c%
format-warn-prefix = "󰔏 "
label-warn = %temperature-c%
label-warn-foreground = ${colors.blood}

[module/mem]
type = internal/memory
interval = 3
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.dim}
label = %percentage_used:2%%

click-left = ~/dotfiles/bin/hog &
[module/disk]
type = internal/fs
mount-0 = /
interval = 60
format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.dim}
label-mounted = %free%

[module/wifi]
type = internal/network
interface-type = wireless
interval = 5
format-connected-prefix = "󰖩 "
format-connected-prefix-foreground = ${colors.dim}
label-connected = %signal%%
label-disconnected = %{F#c2564a}󰖪 off%{F-}

[module/vol]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.dim}
label-volume = %percentage%
label-muted = %{F#7d8079}󰝟 --%{F-}
click-left = ~/dotfiles/bin/audio-out &
click-right = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

[module/mic]
type = custom/script
exec = ~/dotfiles/bin/audio-in status
interval = 2
click-left = ~/dotfiles/bin/audio-in &
click-right = wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

[module/bt]
type = custom/script
exec = ~/dotfiles/bin/bt status
interval = 4
click-left = ~/dotfiles/bin/bt &


[module/bat]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
low-at = 15
format-charging-prefix = "󰂄 "
format-charging-prefix-foreground = ${colors.dim}
label-charging = %{F#8fbf8f}+%{F-}%percentage%
format-discharging = <ramp-capacity> <label-discharging>
ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁾
ramp-capacity-4 = 󰂀
ramp-capacity-5 = 󰁹
ramp-capacity-foreground = ${colors.dim}
label-discharging = %percentage%
format-full-prefix = "󰁹 "
format-full-prefix-foreground = ${colors.dim}
label-full = %{F#8fbf8f}full%{F-}
label-low = %{F#c2564a}󰂃 %percentage%%{F-}

[module/kbd]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
blacklist-2 = caps lock
format = <label-layout>
format-prefix = "󰌌 "
format-prefix-foreground = ${colors.dim}
label-layout = %{F#d4a02a}%icon%%{F-}
layout-icon-default = %layout%
layout-icon-0 = us;EN
layout-icon-1 = ara;ع

[module/tray]
type = internal/tray
tray-spacing = 6
tray-size = 60%

[module/power]
type = custom/text
format = %{T3}⏻%{T-}
format-foreground = ${colors.dim}
format-padding = 1
click-left = ~/dotfiles/bin/power &

; ---------- other styles (Super + Alt + b to switch) ----------
[bar/bottom]
inherit = bar/main
bottom = true
border-bottom-size = 0
border-top-size = 1
border-top-color = ${colors.line}

[bar/bottom-side]
; polybar inherit is one level only, so repeat the side modules here
inherit = bar/main
modules-left = ghost ws
modules-center = clock dk
modules-right = cpu mem mic bat kbd power
bottom = true
border-bottom-size = 0
border-top-size = 1
border-top-color = ${colors.line}

; islands: three small floating bars
[isl]
height = 30
offset-y = 8
radius = 8
border-size = 0
border-bottom-size = 0
background = #f00f110f
padding-left = 1
padding-right = 1
separator = "  "

[bar/isl-left]
inherit = bar/main
override-redirect = true
wm-restack =
inherit-isl = isl
height = 30
offset-y = 8
radius = 8
border-bottom-size = 0
background = #f00f110f
width = 34%
offset-x = 10
modules-left = ghost ws music
modules-center =
modules-right =

[bar/isl-center]
inherit = bar/main
override-redirect = true
wm-restack =
height = 30
offset-y = 8
radius = 8
border-bottom-size = 0
background = #f00f110f
width = 24%
offset-x = 38%
modules-left =
modules-center = rec mind clock dk
modules-right =

[bar/isl-right]
inherit = bar/main
override-redirect = true
wm-restack =
height = 30
offset-y = 8
radius = 8
border-bottom-size = 0
background = #f00f110f
width = 36.6%
offset-x = 63%
modules-left =
modules-center =
modules-right = cpu temp mem wifi bt vol mic bat kbd tray power
